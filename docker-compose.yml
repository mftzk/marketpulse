services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
      POSTGRES_DB: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://marketpulse:marketpulse@db:5432/marketpulse
      REDIS_URL: redis://redis:6379
      NEWS_PROVIDER: mock
      NEWS_MODE: live
      MARKET_PROVIDER: mock
      FUNDAMENTAL_PROVIDER: mock
      PIPELINE_AUTORUN: "1"
      PIPELINE_TICK_SECONDS: "30"
      LOG_LEVEL: info
      AUTH_ENABLED: "1"
      SESSION_SECRET: dev-only-session-secret-change-me-32chars
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
